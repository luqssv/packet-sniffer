name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,exe]"

      - name: Run tests
        run: python -m pytest

      - name: Build executable
        run: >
          pyinstaller
          --onefile
          --name packet-sniffer
          --paths src
          --collect-all scapy
          src/packet_sniffer/cli.py

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: packet-sniffer-windows
          path: dist/packet-sniffer.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/packet-sniffer.exe --clobber
          } else {
            gh release create $tag dist/packet-sniffer.exe --title $tag --notes "Windows executable for Packet Sniffer."
          }
